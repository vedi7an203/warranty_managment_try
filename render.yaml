services:
  - type: web
    name: warranty-managment-try
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    preDeployCommand: flask init-db
    envVars:
      # Create a PostgreSQL database on Render, then paste its Internal Database URL here.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_APP
        value: app.py

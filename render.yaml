databases:
  - name: warranty-db
    databaseName: warranty_db
    user: warranty_user
    plan: free

services:
  - type: web
    name: warranty-managment-try
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    preDeployCommand: flask init-db
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: warranty-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_APP
        value: app.py
